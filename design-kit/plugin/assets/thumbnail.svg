<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04080f"/>
      <stop offset="0.55" stop-color="#0a101c"/>
      <stop offset="1" stop-color="#0a1e38"/>
    </linearGradient>
    <linearGradient id="card" x1="980" y1="160" x2="1700" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#162033"/>
      <stop offset="1" stop-color="#111a2a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="960" fill="url(#bg)"/>
  <!-- cyan glow blobs -->
  <circle cx="420" cy="200" r="220" fill="#06b6d4" fill-opacity="0.12"/>
  <circle cx="1500" cy="720" r="280" fill="#06b6d4" fill-opacity="0.1"/>
  <circle cx="1100" cy="180" r="160" fill="#69be28" fill-opacity="0.06"/>

  <!-- Left copy -->
  <text x="120" y="320" fill="#e8eef8" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700">Powers Design Kit</text>
  <text x="120" y="400" fill="#8b9bb0" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="500">Sync tokens. Audit components. Ship the kit.</text>
  <text x="120" y="470" fill="#67e8f9" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="24">@powers/ui · Figma plugin</text>

  <!-- Pills -->
  <rect x="120" y="520" width="200" height="48" rx="24" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-opacity="0.45"/>
  <text x="150" y="551" fill="#67e8f9" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Variables</text>
  <rect x="340" y="520" width="170" height="48" rx="24" fill="#69be28" fill-opacity="0.14" stroke="#69be28" stroke-opacity="0.4"/>
  <text x="372" y="551" fill="#8fd44f" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Catalog</text>
  <rect x="530" y="520" width="150" height="48" rx="24" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.35"/>
  <text x="562" y="551" fill="#7dd3fc" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Audit</text>

  <!-- Right mock plugin panel -->
  <rect x="1000" y="140" width="780" height="680" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="2"/>
  <rect x="1000" y="140" width="780" height="72" rx="28" fill="#0a101c"/>
  <rect x="1000" y="188" width="780" height="24" fill="#0a101c"/>
  <circle cx="1040" cy="176" r="8" fill="#fb7185"/>
  <circle cx="1068" cy="176" r="8" fill="#fbbf24"/>
  <circle cx="1096" cy="176" r="8" fill="#69be28"/>
  <text x="1130" y="184" fill="#8b9bb0" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">Powers Design Kit</text>

  <text x="1050" y="280" fill="#e8eef8" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Sync tokens &amp; audit your UI kit</text>
  <text x="1050" y="330" fill="#8b9bb0" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="20">Keep Figma aligned with @powers/ui.</text>

  <rect x="1050" y="380" width="680" height="64" rx="14" fill="#06b6d4"/>
  <text x="1220" y="422" fill="#04080f" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">Sync Variables from design-kit</text>

  <rect x="1050" y="464" width="680" height="56" rx="14" fill="transparent" stroke="#334155" stroke-width="2"/>
  <text x="1260" y="500" fill="#e8eef8" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">Audit catalog coverage</text>

  <rect x="1050" y="540" width="680" height="56" rx="14" fill="transparent" stroke="#334155" stroke-width="2"/>
  <text x="1240" y="576" fill="#e8eef8" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">Create stubs for missing</text>

  <rect x="1050" y="640" width="680" height="120" rx="14" fill="#04080f" stroke="#1e293b"/>
  <text x="1074" y="684" fill="#67e8f9" font-family="IBM Plex Mono, monospace" font-size="18">Catalog: 49/49 matched</text>
  <text x="1074" y="720" fill="#8b9bb0" font-family="IBM Plex Mono, monospace" font-size="18">Variables: dual + instrument synced</text>
  <text x="1074" y="756" fill="#69be28" font-family="IBM Plex Mono, monospace" font-size="18">Missing: (none)</text>
</svg>
