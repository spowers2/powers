name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · size · design-kit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (avoid dual pin with action-setup)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Package exports resolve types from dist/ — build before typecheck.
      - name: Build packages
        run: pnpm build

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Size budgets
        run: pnpm size

      - name: Design-kit tokens + component catalog
        run: pnpm design-kit:check

      - name: Figma plugin build
        run: pnpm design-kit:plugin:build

      - name: No legacy package scope in dist
        run: |
          if grep -r '@power-ui' packages/*/dist 2>/dev/null; then
            echo "Found stale @power-ui references in packages/*/dist"
            exit 1
          fi
          echo "dist clean of @power-ui"

      # Catches Vite/JSX consumer footguns (e.g. React is not defined) before publish.
      - name: Consumer scaffold smoke
        run: pnpm smoke:consumer
